services:
  postgres:
    image: postgres:16
    container_name: postgresql
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"   # host:container — monolith (local) connects via localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_v1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9094:9094"   # host:container — monolith (local) connects via localhost:9094
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui
    ports:
      - "8081:8080"   # open browser at localhost:8081 to inspect Kafka topics
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # Only started with: docker compose --profile full up
  monolith:
    profiles: ["full"]
    build:
      context: .
      dockerfile: monolith/Dockerfile
    container_name: monolith
    depends_on:
      - postgres
      - kafka
    ports:
      - "${APP_PORT:-8080}:8080"  # host:container
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/db    # override: use Docker hostname
      KAFKA_URL: kafka:9092                          # override: use Docker internal port

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      - kafka
    ports:
      - "8084:8084"   # host:container
    environment:
      KAFKA_URL: kafka:9092   # Docker internal port

volumes:
  postgres_data:
  kafka_data:
