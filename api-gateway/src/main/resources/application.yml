server:
  port: 8000

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      observability:
        enabled: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/auth/**,/users/**
        - id: banking-service
          uri: ${BANKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/accounts/**,/transactions/**

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    baggage:
      enabled: false
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
