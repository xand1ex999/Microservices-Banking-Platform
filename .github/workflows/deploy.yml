name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Test
        run: mvn clean verify --batch-mode --no-transfer-progress

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/deployed

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing on the server — deployment aborted"
              exit 1
            fi

            git fetch origin
            git reset --hard origin/main
            docker compose --profile full up --build --remove-orphans --wait -d
            docker image prune -f
